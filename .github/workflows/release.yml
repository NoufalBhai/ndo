name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          out="ndo"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="ndo.exe"; fi
          go build -ldflags "-X main.version=${{ github.ref_name }}" -o "$out" ./cmd/ndo

          name="ndo_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "dist/${name}.zip" "$out"
          else
            tar czf "dist/${name}.tar.gz" "$out"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ndo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: (cd dist && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
