name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ndo version
      description: Output of `ndo --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest recipe/command that reproduces the problem — e.g. the
        relevant `[recipes.*]` or `[vars.*]` block from your `.ndo.toml` or
        `central.toml`, and the exact `ndo ...` invocation.
      render: toml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error output, if any.
    validations:
      required: true
